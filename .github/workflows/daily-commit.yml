name: Update Changes Commit

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC (11:30 AM IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Activity File
        run: |
          echo "Last update: $(date)" > activity.txt

      - name: Commit and Push
        run: |
          git config --local user.name "jitendradhamdhere"
          git config --local user.email "jitendradhamdhere333@gmail.com"

          git add activity.txt
          git commit -m "Daily contribution update $(date '+%Y-%m-%d')" || exit 0
          
          # Force push directly to HEAD to bypass any merge conflicts
          git push origin HEAD:main --force
